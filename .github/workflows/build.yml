# Mac(.pkg) と Windows(.exe) のインストーラーをクラウドでビルドする
# - 「Actions」タブから手動実行 → Artifacts からダウンロード（テスト用）
# - v0.1.0 のようなタグを push → GitHub Releases に両方を自動添付（配布用）
name: Build installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '既存Releaseに添付する場合のタグ（例 v0.1.1）。空ならテストビルドのみ'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VER=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        if: startsWith(github.ref, 'refs/tags/')
      - name: Version (dev / manual)
        run: |
          T="${{ inputs.release_tag }}"
          if [ -n "$T" ]; then echo "VER=${T#v}" >> $GITHUB_ENV; else echo "VER=0.0.0-dev" >> $GITHUB_ENV; fi
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Configure
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DDBL_COPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release -j3
      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/DelayBasicsLab_artefacts/Release/AU/Delay Basics Lab.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Dbl1 Jpkl | tail -3
      - name: Package
        run: |
          zsh packaging/mac/build_pkg.sh "$VER"
          zsh packaging/mac/build_zip.sh "$VER"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.pkg
            dist/*.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: |
          T="${{ inputs.release_tag }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "VER=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          elif [[ -n "$T" ]]; then echo "VER=${T#v}" >> $GITHUB_ENV
          else echo "VER=0.0.0-dev" >> $GITHUB_ENV; fi
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DDBL_COPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Package
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VER" packaging\win\installer.iss
      - name: Package (manual zip)
        shell: pwsh
        run: |
          $art = "build\DelayBasicsLab_artefacts\Release"
          $dir = "build\zip\DelayBasicsLab-$env:VER-win64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item -Recurse "$art\VST3\Delay Basics Lab.vst3" $dir
          Copy-Item "$art\Standalone\Delay Basics Lab.exe" $dir
          Copy-Item "packaging\win\license-win.txt" "$dir\license.txt"
          Copy-Item "packaging\manual\README-win.txt" "$dir\HOW_TO_INSTALL.txt"
          Compress-Archive -Path $dir -DestinationPath "dist\DelayBasicsLab-$env:VER-win64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true

  # 手動実行で release_tag を指定した時：既存Releaseにファイルを追加・差し替え
  attach:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/* --clobber -R "${{ github.repository }}"
