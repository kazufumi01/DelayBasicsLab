# Mac(.pkg) と Windows(.exe) のインストーラーをクラウドでビルドする
# - 「Actions」タブから手動実行 → Artifacts からダウンロード（テスト用）
# - v1.0.0 のようなタグを push → GitHub Releases に両方を自動添付（配布用）
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VER=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        if: startsWith(github.ref, 'refs/tags/')
      - name: Version (dev)
        run: echo "VER=0.0.0-dev" >> $GITHUB_ENV
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Configure
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DDBL_COPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release -j3
      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/DelayBasicsLab_artefacts/Release/AU/Delay Basics Lab.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Dbl1 Jpkl | tail -3
      - name: Package
        run: zsh packaging/mac/build_pkg.sh "$VER"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.pkg

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "VER=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV; else echo "VER=0.0.0-dev" >> $GITHUB_ENV; fi
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DDBL_COPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Package
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VER" packaging\win\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
